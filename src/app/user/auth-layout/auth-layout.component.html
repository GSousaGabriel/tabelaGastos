<div class="grid min-h-dvh lg:grid-cols-2">
    <section class="hidden flex-col justify-between bg-teal-900 p-12 text-white lg:flex">
        <div class="flex items-center gap-3">
            <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-white text-teal-800" aria-hidden="true">
                <i class="pi pi-wallet text-lg"></i>
            </span>
            <span class="text-lg font-semibold">Financial Control</span>
        </div>

        <div class="max-w-lg">
            <h2 class="m-0 text-4xl leading-tight font-semibold">See where your money goes, month after month.</h2>
            <ul class="m-0 mt-8 flex list-none flex-col gap-4 p-0">
                @for (feature of features; track feature.icon) {
                <li class="flex items-start gap-3 text-teal-50">
                    <i [class]="feature.icon + ' mt-1 text-teal-300'" aria-hidden="true"></i>
                    <span>{{ feature.text }}</span>
                </li>
                }
            </ul>
        </div>

        <span></span>
    </section>

    <main class="flex items-center justify-center p-6">
        <div class="w-full max-w-md rounded-2xl border border-line bg-card p-6 shadow-md sm:p-8">
            <div class="mb-6 flex items-center gap-3 lg:hidden">
                <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-teal-700 text-white" aria-hidden="true">
                    <i class="pi pi-wallet text-lg"></i>
                </span>
                <span class="text-lg font-semibold">Financial Control</span>
            </div>
            <h1 class="m-0 text-2xl font-semibold">{{ heading() }}</h1>
            <p class="m-0 mt-1 mb-6 text-muted">{{ subheading() }}</p>
            <ng-content></ng-content>
        </div>
    </main>
</div>
